name: TLE Refresh

# Keeps public/data/tle.json from going stale without anyone having to
# remember to run `npm run fetch-tle` by hand. Runs every day at 03:17 UTC.
# A daily cadence leaves substantial room below the 3-day in-app staleness
# warning even when a scheduled GitHub run is delayed or a single CelesTrak
# refresh fails. The minute is deliberately off the hour to avoid the busiest
# GitHub Actions schedule slot.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# A scheduled run overlapping a manual dispatch would race on `git push`.
concurrency:
  group: tle-refresh
  cancel-in-progress: false

jobs:
  refresh-tle:
    name: Fetch latest TLE data & commit if changed
    runs-on: ubuntu-latest
    # fetch-tle bounds every request, but cap the job too so a hang can never
    # hold a runner for GitHub's 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # fetch-tle.mjs also downloads satcat.csv and joins OWNER → country/owner.
      - name: Fetch latest TLE + SATCAT enrichment from CelesTrak
        run: npm run fetch-tle

      # Pushes made with GITHUB_TOKEN do not trigger ci.yml, so validate the
      # new dataset here before it can reach production.
      - name: Build and unit-test against the new dataset
        run: |
          npm run build
          npm test

      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- public/data/tle.json; then
            echo "tle.json unchanged — nothing to commit."
            exit 0
          fi

          git add public/data/tle.json
          git commit -m "chore: automated TLE data refresh"
          # Someone may have pushed while this job ran — replay on top.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
